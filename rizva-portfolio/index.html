  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F5F5F5;
      --ink: #1A1A1A;
      --muted: #737373;
      --line: #E6E6E6;
      --pill-bg: #1A1A1A;
      --pill-ink: #FFFFFF;
    }
    body.lights-off {
      --bg: #1A1A1A;
      --surface: #242424;
      --ink: #FFFFFF;
      --muted: #9E9E9E;
      --line: #2E2E2E;
      --pill-bg: #FFFFFF;
      --pill-ink: #1A1A1A;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      transition: background-color 0.3s ease, color 0.3s ease;
      letter-spacing: -0.015em;
    }
    .nv-border { border-color: var(--line); }
    .nv-surface { background-color: var(--surface); }
    .nv-muted { color: var(--muted); }
  </style>

      <div class="flex flex-wrap items-baseline gap-x-3 gap-y-0.5">

        <span class="text-xs nv-muted">3D Artist at One Week Wonders Studio</span>
      </div>

      <div class="flex items-center gap-3">
        <button id="btn-lights" type="button" class="text-xs nv-muted underline underline-offset-4 hover:opacity-100 transition">
          Lights on/off

        <h1 class="text-xl sm:text-2xl font-medium tracking-tight">3D Isometric Animations</h1>
      </div>

      <!-- Theme 1: Playful (Hero: Creative Overflow) -->

        <h2 class="text-sm font-medium nv-muted">Playful</h2>
        <div id="grid-playful" class="space-y-4"></div>

      <!-- Theme 2: Green -->

        <h2 class="text-sm font-medium nv-muted">Green</h2>
        <div id="grid-green" class="space-y-4"></div>
      </div>

      <!-- Theme 3: Blue -->
      <div class="space-y-4 pt-4">
        <h2 class="text-sm font-medium nv-muted">Blue</h2>
        <div id="grid-blue" class="space-y-4"></div>
      </div>
    </section>

    <!-- SET 02 (BOTTOM): WINCLEX -->
    <section id="set-winclex" class="border-t nv-border pt-14 space-y-6">
      <div class="border-b nv-border pb-3">
        <h2 class="text-xl sm:text-2xl font-medium tracking-tight">WINCLEX — Company Animations</h2>

      <div id="grid-winclex" class="space-y-4"></div>

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function videoSlot(id, title, isHero) {
      return `
        <div class="relative h-full w-full">
          <iframe
            data-src="https://drive.google.com/file/d/${escapeHtml(id)}/preview"
            class="lazy-frame h-full w-full border-0"
            allow="autoplay; fullscreen"
            title="${escapeHtml(title)}"
          ></iframe>
          <!-- Shield over Google Drive's top-right pop-out icon so viewers stay on this page -->
          <div class="absolute right-0 top-0 h-14 w-14 z-10 bg-transparent" aria-hidden="true"></div>
        </div>
      `;
    }

    function renderCollection(containerId, data) {
      const container = document.getElementById(containerId);
      if (!container) return;

      const heroHtml = `
        <div class="space-y-2">
          <div class="overflow-hidden rounded-xl border nv-border nv-surface aspect-[16/9] max-h-[600px] w-full">
            ${videoSlot(data.hero.id, data.hero.title, true)}
          </div>
          <div class="flex items-center justify-between text-xs">
            <span class="font-medium">${escapeHtml(data.hero.title)}</span>
          </div>
        </div>
      `;

      const smallGridHtml = `
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
          ${data.items.map(item => `
            <div class="space-y-1.5">
              <div class="overflow-hidden rounded-lg border nv-border nv-surface aspect-[4/3]">
                ${videoSlot(item.id, item.title, false)}
              </div>
              <div class="flex items-center justify-between text-[11px]">
                <span class="truncate font-medium">${escapeHtml(item.title)}</span>
              </div>
            </div>
          `).join("")}
        </div>
      `;

      container.innerHTML = heroHtml + smallGridHtml;
    }

    function initStaggeredLazyFrames() {
      const frames = Array.from(document.querySelectorAll("iframe.lazy-frame"));
      if (!("IntersectionObserver" in window)) {
        frames.forEach((f, idx) => {
          setTimeout(() => { f.src = f.getAttribute("data-src"); }, idx * 140);
        });
        return;
      }

      let loadQueue = [];
      let loadingActive = false;

      function processQueue() {
        if (!loadQueue.length) {
          loadingActive = false;
          return;
        }
        loadingActive = true;
        const frame = loadQueue.shift();
        if (frame && !frame.src) {
          frame.src = frame.getAttribute("data-src");
        }
        setTimeout(processQueue, 180);
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const frame = entry.target;
            observer.unobserve(frame);
            if (!frame.src) {
              loadQueue.push(frame);
              if (!loadingActive) processQueue();
            }
          }
        });
      }, { rootMargin: "250px 0px" });

      frames.forEach(f => observer.observe(f));
    }

    let lightsOff = false;
    try {
      lightsOff = localStorage.getItem("rizva_lights_off") === "1";
    } catch (e) {}
    if (lightsOff) document.body.classList.add("lights-off");

    document.getElementById("btn-lights").addEventListener("click", () => {
      lightsOff = !lightsOff;
      document.body.classList.toggle("lights-off", lightsOff);
      try { localStorage.setItem("rizva_lights_off", lightsOff ? "1" : "0"); } catch (e) {}
    });

    renderCollection("grid-playful", COLLECTIONS.playful);
    renderCollection("grid-green", COLLECTIONS.green);
    renderCollection("grid-blue", COLLECTIONS.blue);
    renderCollection("grid-winclex", COLLECTIONS.winclex);
    initStaggeredLazyFrames();
  </script>
