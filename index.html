<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rizva Bahrum — 3D Artist</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F5F5F5;
      --ink: #1A1A1A;
      --muted: #737373;
      --line: #E6E6E6;
      --pill-bg: #1A1A1A;
      --pill-ink: #FFFFFF;
    }
    body.lights-off {
      --bg: #1A1A1A;
      --surface: #242424;
      --ink: #FFFFFF;
      --muted: #9E9E9E;
      --line: #2E2E2E;
      --pill-bg: #FFFFFF;
      --pill-ink: #1A1A1A;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      transition: background-color 0.3s ease, color 0.3s ease;
      letter-spacing: -0.015em;
    }
    .nv-border { border-color: var(--line); }
    .nv-surface { background-color: var(--surface); }
    .nv-muted { color: var(--muted); }
    video::-webkit-media-controls {
      display: none !important;
    }
  </style>
</head>
<body class="antialiased" oncontextmenu="return false;">

  <!-- Minimal Header -->
  <header class="sticky top-0 z-30 border-b nv-border backdrop-blur-md" style="background-color: color-mix(in srgb, var(--bg) 90%, transparent);">
    <div class="mx-auto flex max-w-[1360px] items-center justify-between px-5 py-4 sm:px-8">
      <div class="flex flex-wrap items-baseline gap-x-3 gap-y-0.5">
        <a href="#top" class="text-sm font-medium tracking-tight">Rizva Bahrum</a>
        <span class="text-xs nv-muted">3D Artist at One Week Wonders Studio</span>
      </div>

      <div class="flex items-center gap-3">
        <button id="btn-lights" type="button" class="text-xs nv-muted underline underline-offset-4 hover:opacity-100 transition">
          Lights on/off
        </button>
      </div>
    </div>
  </header>

  <main id="top" class="mx-auto max-w-[1360px] px-5 py-10 sm:px-8 sm:py-14 space-y-20">

    <!-- SET 01 (TOP): 3D ISOMETRIC ANIMATIONS — PLAYFUL, GREEN, BLUE -->
    <section id="set-isometric" class="space-y-14">
      <div class="border-b nv-border pb-3">
        <h1 class="text-xl sm:text-2xl font-medium tracking-tight">3D Isometric Animations</h1>
      </div>

      <!-- Theme 1: Playful (Hero: Creative Overflow) -->
      <div class="space-y-4">
        <h2 class="text-sm font-medium nv-muted">Playful</h2>
        <div id="grid-playful" class="space-y-4"></div>
      </div>

      <!-- Theme 2: Green -->
      <div class="space-y-4 pt-4">
        <h2 class="text-sm font-medium nv-muted">Green</h2>
        <div id="grid-green" class="space-y-4"></div>
      </div>

      <!-- Theme 3: Blue -->
      <div class="space-y-4 pt-4">
        <h2 class="text-sm font-medium nv-muted">Blue</h2>
        <div id="grid-blue" class="space-y-4"></div>
      </div>
    </section>

    <!-- SET 02 (BOTTOM): WINCLEX -->
    <section id="set-winclex" class="border-t nv-border pt-14 space-y-6">
      <div class="border-b nv-border pb-3">
        <h2 class="text-xl sm:text-2xl font-medium tracking-tight">WINCLEX — Company Animations</h2>
      </div>
      <div id="grid-winclex" class="space-y-4"></div>
    </section>

  </main>

  <!-- Minimal Footer -->
  <footer class="border-t nv-border py-8 text-xs nv-muted">
    <div class="mx-auto flex max-w-[1360px] items-center justify-between px-5 sm:px-8">
      <span>Rizva Bahrum — One Week Wonders Studio</span>
      <span>3D Portfolio</span>
    </div>
  </footer>

  <script>
    const PATH_PLAYFUL = "videos/MIXAR PORTFOLIO/Set 2 (3D Isometric Animations - Playful Dribbble)/Colorful Isometric";
    const PATH_GREEN = "videos/MIXAR PORTFOLIO/Set 2 (3D Isometric Animations - Playful Dribbble)/Green Isometric";
    const PATH_BLUE = "videos/MIXAR PORTFOLIO/Set 2 (3D Isometric Animations - Playful Dribbble)/Blue Isometric";
    const PATH_WINCLEX = "videos/MIXAR PORTFOLIO/Set 1 (Company Animations - WINCLEX)";

    const COLLECTIONS = {
      playful: {
        folder: PATH_PLAYFUL,
        hero: {
          title: "Creative Overflow",
          file: "Salinan Creative Flow (1600x1200_Looping)(1).mp4"
        },
        items: [
          { title: "Beyond Boundaries", file: "Salinan Beyond Boundaries (1600x1200_Looping)(1).mp4" },
          { title: "Shaping Ideas Into Reality", file: "Salinan Shaping Ideas Into Reality (1600x1200_Looping).mp4" },
          { title: "Designing Experience, Not Just Visual", file: "Salinan Designing Experience, Not Just Visual (1600x1200_Looping).mp4" },
          { title: "Visual Storytelling", file: "Salinan Visual Storytelling (1600x1200_Looping).mp4" },
          { title: "Chaos to Clarity", file: "Salinan Chaos to Clarity (1600x1200_Looping).mp4" },
          { title: "Pixel Perfect", file: "Salinan Pixel Perfect (1600x1200_Looping).mp4" },
          { title: "Behind the Screen", file: "Salinan Behind the Screen (1600x1200_Looping).mp4" },
          { title: "Coffee & Brainstorm", file: "Salinan Coffee & Brainstorm (1600x1200_Looping).mp4" },
          { title: "Daily Grind & Gradient", file: "Salinan Daily Grind & Gradient (1600x1200_Looping).mp4" }
        ]
      },
      green: {
        folder: PATH_GREEN,
        hero: {
          title: "Green Isometric 08 (Hero)",
          file: "Salinan Green Isometric Animations 8 (Hero).mp4"
        },
        items: [
          { title: "Green Isometric 01", file: "Salinan Green Isometric Animations 1.mp4" },
          { title: "Green Isometric 02", file: "Salinan Green Isometric Animations 2.mp4" },
          { title: "Green Isometric 03", file: "Salinan Green Isometric Animations 3.mp4" },
          { title: "Green Isometric 04", file: "Salinan Green Isometric Animations 4.mp4" },
          { title: "Green Isometric 05", file: "Salinan Green Isometric Animations 5.mp4" },
          { title: "Green Isometric 06", file: "Salinan Green Isometric Animations 6.mp4" },
          { title: "Green Isometric 07", file: "Salinan Green Isometric Animations 7.mp4" }
        ]
      },
      blue: {
        folder: PATH_BLUE,
        hero: {
          title: "Blue Isometric 09 (Hero)",
          file: "Salinan Blue Isometric Animations 9 (Hero).mp4"
        },
        items: [
          { title: "Blue Isometric 01", file: "Salinan Blue Isometric Animations 1.mp4" },
          { title: "Blue Isometric 02", file: "Salinan Blue Isometric Animations 2.mp4" },
          { title: "Blue Isometric 03", file: "Salinan Blue Isometric Animations 3.mp4" },
          { title: "Blue Isometric 04", file: "Salinan Blue Isometric Animations 4.mp4" },
          { title: "Blue Isometric 05", file: "Salinan Blue Isometric Animations 5.mp4" },
          { title: "Blue Isometric 06", file: "Salinan Blue Isometric Animations 6.mp4" },
          { title: "Blue Isometric 07", file: "Salinan Blue Isometric Animations 7.mp4" },
          { title: "Blue Isometric 08", file: "Salinan Blue Isometric Animations 8.mp4" }
        ]
      },
      winclex: {
        folder: PATH_WINCLEX,
        hero: {
          title: "Final Map",
          file: "FINAL MAP (Background).mp4"
        },
        items: [
          { title: "Infrastructure", file: "INFRASTRUCTURE (Background).mp4" },
          { title: "Energy", file: "ENERGY (Background).mp4" },
          { title: "Offshore", file: "OFFSHORE (Background).mp4" },
          { title: "Petrochemical", file: "PETROCHEMICAL (Background).mp4" },
          { title: "Waterfront", file: "WATERFRONT (Background).mp4" },
          { title: "Facade Care", file: "FASADE CARE (Background).mp4" },
          { title: "Entertainment", file: "ENTERTAINMENT (Background).mp4" },
          { title: "Mobile Clean", file: "MOBILE CLEAN (Background).mp4" }
        ]
      }
    };

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function encodeRepoPath(folder, file) {
      const fullPath = `${folder}/${file}`;
      return fullPath.split("/").map(part => encodeURIComponent(part)).join("/");
    }

    function videoSlot(folder, file, title) {
      const encoded = encodeRepoPath(folder, file);
      const lfsUrl = `https://media.githubusercontent.com/media/rizvabahrum/portfolio-project/main/${encoded}`;
      const relUrl = `./${encoded}`;
      const rawUrl = `https://github.com/rizvabahrum/portfolio-project/raw/main/${encoded}`;

      return `
        <div class="video-card group relative h-full w-full overflow-hidden cursor-pointer select-none" onclick="toggleVideo(this)">
          <video
            data-src-primary="${escapeHtml(lfsUrl)}"
            data-src-secondary="${escapeHtml(relUrl)}"
            data-src-tertiary="${escapeHtml(rawUrl)}"
            class="lazy-video block h-full w-full object-cover"
            muted
            loop
            playsinline
            preload="none"
            disablePictureInPicture
            controlsList="nodownload nofullscreen noremoteplayback"
          ></video>
          <div class="play-badge pointer-events-none absolute inset-0 flex items-center justify-center bg-black/5 opacity-0 transition-opacity duration-200 group-hover:opacity-100">
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-black/65 text-white backdrop-blur-sm">
              <svg class="icon-play h-3.5 w-3.5 translate-x-[1px] hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg class="icon-pause h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </span>
          </div>
        </div>
      `;
    }

    function updateBadgeState(card, video) {
      if (!card || !video) return;
      const playIcon = card.querySelector(".icon-play");
      const pauseIcon = card.querySelector(".icon-pause");
      const badge = card.querySelector(".play-badge");
      if (video.paused) {
        if (playIcon) playIcon.classList.remove("hidden");
        if (pauseIcon) pauseIcon.classList.add("hidden");
        if (badge) badge.classList.remove("opacity-0");
      } else {
        if (playIcon) playIcon.classList.add("hidden");
        if (pauseIcon) pauseIcon.classList.remove("hidden");
        if (badge) badge.classList.add("opacity-0");
      }
    }

    function toggleVideo(card) {
      const video = card.querySelector("video");
      if (!video) return;
      if (!video.src) {
        loadVideoElement(video, true);
        return;
      }
      if (video.paused) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
      updateBadgeState(card, video);
    }

    function renderCollection(containerId, data) {
      const container = document.getElementById(containerId);
      if (!container) return;

      const isWinclex = containerId === "grid-winclex";
      const aspectClass = isWinclex ? "aspect-[16/9]" : "aspect-[4/3]";
      const heroHtml = `
        <div class="space-y-2 max-w-4xl mx-auto">
          <div class="overflow-hidden rounded-xl border nv-border nv-surface w-full ${aspectClass}">
            ${videoSlot(data.folder, data.hero.file, data.hero.title)}
          </div>
          <div class="flex items-center justify-between text-xs">
            <span class="font-medium">${escapeHtml(data.hero.title)}</span>
          </div>
        </div>
      `;

      const smallGridHtml = `
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
          ${data.items.map(item => `
            <div class="space-y-1.5">
              <div class="overflow-hidden rounded-lg border nv-border nv-surface ${aspectClass}">
                ${videoSlot(data.folder, item.file, item.title)}
              </div>
              <div class="flex items-center justify-between text-[11px]">
                <span class="truncate font-medium">${escapeHtml(item.title)}</span>
              </div>
            </div>
          `).join("")}
        </div>
      `;

      container.innerHTML = heroHtml + smallGridHtml;
    }

    function loadVideoElement(video, shouldPlay) {
      if (!video || video.dataset.loaded === "1") {
        if (video && shouldPlay && video.paused) {
          video.play().catch(() => {});
        }
        return;
      }
      video.dataset.loaded = "1";
      const sources = [
        video.getAttribute("data-src-primary"),
        video.getAttribute("data-src-secondary"),
        video.getAttribute("data-src-tertiary")
      ].filter(Boolean);

      let attempt = 0;
      const card = video.closest(".video-card");

      video.addEventListener("play", () => updateBadgeState(card, video));
      video.addEventListener("pause", () => updateBadgeState(card, video));

      video.addEventListener("error", () => {
        attempt += 1;
        if (attempt < sources.length) {
          video.src = sources[attempt];
          video.load();
          if (shouldPlay) video.play().catch(() => {});
        }
      });

      video.src = sources[0];
      video.load();
      if (shouldPlay) {
        video.play().catch(() => {
          updateBadgeState(card, video);
        });
      }
    }

    function initVideos() {
      const videos = Array.from(document.querySelectorAll("video.lazy-video"));
      if (!("IntersectionObserver" in window)) {
        videos.forEach(v => loadVideoElement(v, true));
        return;
      }

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target;
          if (entry.isIntersecting) {
            loadVideoElement(video, true);
          } else if (video.dataset.loaded === "1" && !video.paused) {
            video.pause();
          }
        });
      }, { rootMargin: "200px 0px", threshold: 0.1 });

      videos.forEach(v => observer.observe(v));
    }

    let lightsOff = false;
    try {
      lightsOff = localStorage.getItem("rizva_lights_off") === "1";
    } catch (e) {}
    if (lightsOff) document.body.classList.add("lights-off");

    document.getElementById("btn-lights").addEventListener("click", () => {
      lightsOff = !lightsOff;
      document.body.classList.toggle("lights-off", lightsOff);
      try { localStorage.setItem("rizva_lights_off", lightsOff ? "1" : "0"); } catch (e) {}
    });

    renderCollection("grid-playful", COLLECTIONS.playful);
    renderCollection("grid-green", COLLECTIONS.green);
    renderCollection("grid-blue", COLLECTIONS.blue);
    renderCollection("grid-winclex", COLLECTIONS.winclex);
    initVideos();
  </script>
</body>
</html>
